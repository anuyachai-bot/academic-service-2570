  ST.yearRights=r.yearRights||{};CAP=+r.cfg.cap||50000;

function load(){
  var rememberedRole=Number(ST.role);
  return api("boot",{fy:String(ST.fy||2570)}).then(function(first){
    var u=first.user||{},roles=(Array.isArray(u.roles)?u.roles:[u.role]).map(Number);
    var selected=roles.indexOf(rememberedRole)>-1?rememberedRole:Number(u.role);
    USER={email:u.email,name:u.name,role:Number(u.role),roles:roles};
    /* If a remembered role differs from the account's primary role, request a second
       boot with that role so the server returns only the data permitted for it. */
    if(selected!==Number(u.role)){
      ST.role=selected;
      return api("boot",{fy:String(ST.fy||2570)}).then(applyBootData);
    }
    ST.role=selected;
    return applyBootData(first);

    if(stf&&s!=='เบิกจ่ายค่าใช้จ่ายแล้ว'&&cur===6)b6=G2(wfInp('ยอดเบิกจ่ายจริงรวมที่อนุมัติ (บาท)','disbursement.finalAmount','number',p.disbursement.finalAmount||spentT(p))+wfInp('วันที่อนุมัติเบิกจ่ายเสร็จสิ้น','disbursement.finalDate','date',p.disbursement.finalDate))+row('<button type="button" class="btn o" onclick="saveExternalDoc('+id+',\'disburseFinal\')">💾 บันทึกผลเบิกจ่ายค่าใช้จ่ายเรียบร้อย</button>');
    else{b6='<div class="hint">ยอดเบิกจ่ายจริง: <b>'+fmt(+p.disbursement.finalAmount||spentT(p))+'</b> บาท · วันที่: '+esc(p.disbursement.finalDate||'-')+'</div>';
      if(stf&&s==='เบิกจ่ายค่าใช้จ่ายแล้ว')b6+=row(wfBtn(id,'➡ ส่งตรวจสอบปิดโครงการ','รอตรวจสอบปิดโครงการ','ส่งตรวจสอบเอกสารและปิดโครงการ'))}
    h+=wfSec('ขั้นตอนที่ 6: การเบิกค่าใช้จ่ายและรายงานผลการจัดกิจกรรม',b6)}
  // ขั้นที่ 7
  if(cur>=6){var ck=closureChecks(p),ready=ck.every(function(x){return x[0]}),closed=s==='ปิดโครงการสมบูรณ์',b7='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin:8px 0">'+ck.map(function(x){return'<div style="padding:8px 12px;border-radius:8px;background:'+(x[0]?'#dcfce7':'#fee2e2')+';color:'+(x[0]?'#166534':'#991b1b')+'">'+(x[0]?'✓ ':'✗ ')+esc(x[1])+'</div>'}).join('')+'</div>';
    if(closed)b7+='<div class="hint" style="color:var(--ok);font-size:14px;font-weight:700">🎉 ปิดโครงการสมบูรณ์แล้ว'+(p.closure.closedDate?' เมื่อ '+esc(p.closure.closedDate):'')+'</div>';
    else if(stf&&cur>=6)b7+=row('<button type="button" class="btn '+(ready?'o':'g')+'" onclick="confirmProjectClosure('+id+')">🔒 รับรองและปิดโครงการสมบูรณ์</button>')+(ready?'':'<div class="hint">ต้องครบทุกรายการจึงจะปิดโครงการได้</div>');
    h+=wfSec('ขั้นตอนที่ 7: ตรวจสอบความครบถ้วนและปิดโครงการ (Closure Checklist)',b7)}
  return h+'</div>'}
function saveExternalDoc(id,type){var p=G(id);if(!p)return;wfDefaults(p);var nx,note,need;
  if(type==='award'){nx='ประกาศรายชื่อแล้ว (ได้รับทุน)';note='บันทึกประกาศรับทุนเลขที่ '+(p.award.no||'-');if(!String(p.award.no||'').trim())need='เลขที่ประกาศรับทุน'}
  else if(type==='contract'){nx='ลงนามสัญญาแล้ว';note='บันทึกสัญญาเลขที่ '+(p.contract.no||'-');if(!String(p.contract.no||'').trim())need='เลขที่สัญญา';else if(!p.contract.signDate)need='วันที่ลงนามสัญญา'}
  else if(type==='disburse1'){nx='อนุมัติเบิกเงินงวด 1 แล้ว';note='บันทึกเลขที่ฎีกางวด 1: '+(p.disbursement.inst1No||'-');if(!String(p.disbursement.inst1No||'').trim())need='เลขที่หนังสือ/ฎีกาเบิกเงินงวด 1'}
  else{nx='เบิกจ่ายค่าใช้จ่ายแล้ว';p.disbursement.finalAmount=+p.disbursement.finalAmount||spentT(p);note='บันทึกเบิกจ่ายงวดสุดท้าย ยอดเงิน '+fmt(p.disbursement.finalAmount)+' บาท'}
  if(need)return alert('กรุณากรอก'+need+'ก่อนบันทึก');
  Promise.resolve(CLOUD?flush():0).then(function(){return applySt(id,nx,note)}).catch(function(e){alert(emsg(e))})}
function confirmProjectClosure(id){var p=G(id);if(!p)return;var miss=closureChecks(p).filter(function(x){return!x[0]});if(miss.length)return alert('ยังปิดโครงการไม่ได้ ต้องดำเนินการให้ครบ:\n• '+miss.map(function(x){return x[1]}).join('\n• '));
  if(!confirm('ยืนยันปิดโครงการ "'+(p.th||p.code)+'" สมบูรณ์ใช่หรือไม่?'))return;wfDefaults(p);p.closure.checklistDone=true;p.closure.closedDate=new Date().toISOString().slice(0,10);p.closure.closedBy=(USER&&USER.email)||'เจ้าหน้าที่';
  Promise.resolve(CLOUD?flush():0).then(function(){return applySt(id,'ปิดโครงการสมบูรณ์','ปิดโครงการสมบูรณ์และบันทึกผลสัมฤทธิ์ครบถ้วน')}).catch(function(e){alert(emsg(e))})}
var _formWF=form;form=function(){var p=P(),h=_formWF();if(!p||ST.role===3)return h;return workflowProgressBar(p)+h+workflowActionsCard(p)};
var _docWF=doc;doc=function(){var p=P(),h=_docWF();if(!p)return h;return workflowProgressBar(p)+h+workflowActionsCard(p)};

/* ===== Executive 1-Page Summary & Pipeline Visualizer ===== */
function executiveSummaryPrint(){
  var fy = ST.fy || '2570';
  var ps = ST.ps || [];
  var totalRequested = sum(ps, totT);
  var approvedProjs = ps.filter(function(p){ return isAp(p.status); });
  var totalApproved = sum(approvedProjs, totT);
  var totalSpent = sum(ps, spentT);
  var disbursePct = totalApproved ? Math.round(totalSpent / totalApproved * 100) : 0;

  var stepCount = [0,0,0,0,0,0,0];
  ps.forEach(function(p){
    var st = currentStep(p);
    stepCount[st - 1]++;
  });

  var win = window.open('','_blank','width=900,height=800');
  var h = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>รายงานสรุปผู้บริหาร ปีงบประมาณ '+esc(fy)+'</title>';
  h += '<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">';
  h += '<style>body{font-family:Sarabun,sans-serif;padding:30px;color:#1b2433;line-height:1.5}h1{font-size:18px;margin:0 0 4px;color:#173C6E}h2{font-size:14px;font-weight:400;margin:0 0 16px;color:#64748b}table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}th,td{border:1px solid #cbd5e1;padding:8px 10px;text-align:left}th{background:#f1f5f9;font-weight:700}.card{border:1px solid #cbd5e1;border-radius:10px;padding:14px;margin-bottom:14px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.box{border:1px solid #e2e8f0;background:#f8fafc;padding:10px;border-radius:8px;text-align:center}.box b{display:block;font-size:20px;color:#173C6E}.noprint{margin-bottom:16px}@media print{.noprint{display:none}}</style></head><body>';
  h += '<div class="noprint"><button onclick="window.print()" style="padding:8px 16px;background:#173C6E;color:#fff;border:0;border-radius:6px;font-weight:700;cursor:pointer">🖨️ พิมพ์เอกสาร / บันทึกเป็น PDF</button></div>';
  h += '<h1>สรุปภาพรวมการบริหารงานบริการวิชาการรับใช้สังคม ปีงบประมาณ '+esc(fy)+'</h1>';
  h += '<h2>คณะรัฐศาสตร์และรัฐประศาสนศาสตร์ มหาวิทยาลัยเชียงใหม่ · ข้อมูล ณ วันที่ '+new Date().toLocaleDateString('th-TH')+'</h2>';

  h += '<div class="g">';
  h += '<div class="box"><b>'+ps.length+'</b>โครงการทั้งหมด</div>';
  h += '<div class="box"><b>'+fmt(totalRequested)+' บาท</b>วงเงินเสนอขอรวม</div>';
  h += '<div class="box"><b>'+fmt(totalApproved)+' บาท</b>วงเงินอนุมัติรวม</div>';
  h += '<div class="box"><b>'+disbursePct+'%</b>อัตราเบิกจ่าย ('+fmt(totalSpent)+' บาท)</div>';
  h += '</div>';

  h += '<div class="card"><h3 style="margin:0 0 8px;font-size:14px">ความก้าวหน้าโครงการตาม 7 ขั้นตอน (Workflow Pipeline)</h3>';
  h += '<table><tr><th>1. ข้อเสนอ/พิจารณา</th><th>2. ประกาศผล</th><th>3. ทำสัญญา</th><th>4. อนุมัติ/เบิกงวด 1</th><th>5. ดำเนินงาน</th><th>6. เบิกจ่าย</th><th>7. ปิดโครงการ</th></tr>';
  h += '<tr style="text-align:center;font-size:16px;font-weight:700;color:#173C6E">';
  for (var k=0; k<7; k++) h += '<td style="text-align:center">'+stepCount[k]+' โครงการ</td>';
  h += '</tr></table></div>';

  h += '<div class="card"><h3 style="margin:0 0 8px;font-size:14px">รายชื่อและสถานะโครงการทั้งหมด</h3><table><tr><th>รหัส</th><th>ชื่อโครงการ</th><th>หัวหน้าโครงการ</th><th>งบประมาณเสนอขอ</th><th>เบิกจ่ายจริง</th><th>ขั้นตอน</th><th>สถานะ</th></tr>';
  ps.forEach(function(p){
    var st = currentStep(p);
    h += '<tr><td>'+esc(p.code||'-')+'</td><td>'+esc(p.th||'-')+'</td><td>'+esc((p.pi&&p.pi.name)||'-')+'</td><td style="text-align:right">'+fmt(totT(p))+'</td><td style="text-align:right">'+fmt(spentT(p))+'</td><td style="text-align:center">ขั้นที่ '+st+'</td><td>'+esc(p.status)+'</td></tr>';
  });
  h += '</table></div></body></html>';
  win.document.write(h);
  win.document.close();
}
