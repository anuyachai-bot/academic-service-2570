var _revCardBase=revCard;revCard=function(p){
 if(ST.role===4){var st=p.reviewStats||{count:0,total:null,criteria:[]};var labels=CR.map(function(c,i){return'<tr><td>'+esc(c[0])+'</td><td style="text-align:right">'+(st.criteria&&st.criteria[i]!=null?Number(st.criteria[i]).toFixed(2)+' / 20':'-')+'</td></tr>'}).join('');return'<div class="card"><h3>📊 สรุปผลการประเมินสำหรับผู้บริหาร</h3><div class="stats"><div class="st"><b>'+(st.total==null?'-':Number(st.total).toFixed(2))+'</b>คะแนนเฉลี่ยรวม / 100</div><div class="st"><b>'+st.count+'</b>กรรมการที่ส่งคะแนนครบ</div><div class="st"><b>'+(p.assignedReviewers||[]).length+'</b>กรรมการที่ได้รับมอบหมาย</div></div><div class="wrap"><table><tr><th>เกณฑ์การประเมิน</th><th>คะแนนเฉลี่ย</th></tr>'+labels+'</table></div><div class="hint" style="margin-top:8px">แสดงเฉพาะคะแนนเฉลี่ยจากกรรมการที่ได้รับมอบหมายและส่งผลประเมินครบทั้ง 5 เกณฑ์ ไม่แสดงคะแนนรายบุคคล</div></div>'}

 if(ST.role===3&&CLOUD&&USER){var mine=(p.rev||{})[USER.email];if(mine&&mine.submitted===true)return'<div class="card"><h3>📝 ผลการประเมินของคุณ</h3><div class="cap ok">ส่งผลประเมินเรียบร้อยแล้ว</div><b>คะแนนรวม '+rtot(mine)+' / 100</b><div class="hint">ระบบบันทึกผลประเมินแล้ว และไม่สามารถแก้ไขคะแนนหลังส่งได้</div></div>';var btn='<div class="review-submit"><button class="btn o" onclick="submitReview()">ส่งผลการประเมิน (Submit)</button></div>';return html.replace(/<\/div>$/,btn+'</div>')}

function submitReview(){clearTimeout(RT);var p=P(),r=p&&(p.rev||{})[USER.email];if(!p||!r)return alert('กรุณาให้คะแนนก่อนส่งผลประเมิน');if(!reviewCompleteDraft(r))return alert('กรุณาให้คะแนนครบทั้ง 5 เกณฑ์ก่อน Submit');if(!confirm('ยืนยันส่งผลการประเมิน? หลังส่งแล้วจะไม่สามารถแก้ไขคะแนนได้'))return;syncReview().then(function(){return api('review',{id:p.id,s:r.s,n:r.n,submit:true})}).then(function(x){r.submitted=true;p.ver=x.ver;LS[p.id]=JSON.stringify(p);render();alert('ส่งผลการประเมินเรียบร้อยแล้ว')}).catch(function(e){alert(emsg(e))})}

function executiveDecision(id,yes){var p=G(id),to=yes?'อนุมัติทุน':'ไม่ผ่าน';if(!p)return;var note='';if(!yes){note=prompt('กรุณาระบุเหตุผลที่ไม่เห็นชอบ');if(note===null)return;if(!note.trim())return alert('กรุณาระบุเหตุผล');}if(!confirm('ยืนยัน'+(yes?'เห็นชอบ':'ไม่เห็นชอบ')+'โครงการนี้?'))return;flush().then(function(){return api('status',{id:id,to:to,note:note,base:p.ver})}).then(function(r){upd(r.p);render();alert('บันทึกผลการพิจารณาแล้ว')}).catch(function(e){alert(emsg(e))})}
