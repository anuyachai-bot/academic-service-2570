<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบบริหารจัดการงานบริการวิชาการรับใช้สังคม คณะรัฐศาสตร์และรัฐประศาสนศาสตร์ มหาวิทยาลัยเชียงใหม่</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* คงสไตล์ CSS เดิมของคุณทั้งหมดไว้ที่นี่ */
:root{--pri:#173C6E;--pri2:#2563a8;--acc:#0ea5a4;--bg:#eef3f9;--card:#fff;--tx:#1b2433;--mut:#64748b;--bd:#dbe4f0;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
body{margin:0;font-family:Sarabun,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh}
aside{width:260px;background:linear-gradient(170deg,#0f2748 0%,#173C6E 35%,#2563a8 72%,#0ea5a4 125%);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
main{flex:1;overflow:auto;padding:22px}
.nav{padding:10px 14px;border-radius:10px;color:#e3edfa;cursor:pointer;font-size:14px;border:0;background:none;text-align:left;width:100%;margin-bottom:4px}
.nav:hover{background:rgba(255,255,255,.2)}.nav.on{background:#fff;color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.btn{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
.btn.g{background:var(--bd);color:var(--tx)}.btn.r{background:var(--bad)}.btn.o{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}th{background:rgba(23,60,110,.08)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#e0e9f7;color:var(--pri)}
.tag.ok{background:#dcfce7;color:#166534}.tag.bad{background:#fee2e2;color:#991b1b}.tag.w{background:#fef3c7;color:#92400e}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--card);color:var(--tx)}
.ucard{margin-top:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.12);font-size:13px}
.hint{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<aside>
  <h1 style="font-size:13px;margin:0 0 10px">ระบบบริหารจัดการงานบริการวิชาการ<small>คณะรัฐศาสตร์และรัฐประศาสนศาสตร์ มช.</small></h1>
  <div id="nav"></div>
</aside>
<main id="main"></main>
<script>
var ROLES = ["Admin", "หัวหน้าโครงการ / อาจารย์", "เจ้าหน้าที่", "กรรมการ", "ผู้บริหาร", "ชุมชน / ผู้เสนอ"];
var PH = [
  ['ร่าง / บันทึกฉบับร่าง', 'รอหัวหน้าโครงการตรวจสอบ', 'ส่งกลับให้ชุมชนแก้ไข', 'ส่งข้อเสนอแล้ว', 'รอตรวจสอบเอกสาร', 'ส่งกลับแก้ไขข้อเสนอ', 'รอผลการพิจารณา'],
  ['ผ่านการคัดเลือก', 'ไม่ผ่านการพิจารณา', 'ประกาศรายชื่อแล้ว (ได้รับทุน)', 'อนุมัติทุน'],
  ['รอทำสัญญา', 'ลงนามสัญญาแล้ว', 'ทำสัญญาแล้ว'],
  ['ขออนุมัติดำเนินโครงการ/เบิกงวด 1', 'อนุมัติเบิกเงินงวด 1 แล้ว', 'เบิกเงินงวด 1'],
  ['อยู่ระหว่างดำเนินโครงการ', 'รายงานความก้าวหน้าแล้ว', 'รอรายงานความก้าวหน้า', 'รอตรวจสอบรายงาน'],
  ['ส่งหลักฐานเบิกจ่าย/รายงานผล', 'เบิกเงินงวด 2', 'เบิกจ่ายค่าใช้จ่ายแล้ว', 'รอส่งรายงานฉบับสมบูรณ์', 'รอตรวจสอบรายงานฉบับสมบูรณ์'],
  ['รอตรวจสอบปิดโครงการ', 'รอเคลียร์ค่าใช้จ่าย', 'ปิดโครงการสมบูรณ์', 'ยกเลิกโครงการ']
];
var STAT = [].concat.apply([], PH);
var EDIT = ['ร่าง / บันทึกฉบับร่าง'];
var NOTE = ['ส่งกลับแก้ไขข้อเสนอ', 'ส่งกลับให้ชุมชนแก้ไข', 'ไม่ผ่านการพิจารณา', 'ยกเลิกโครงการ', 'รอแก้ไขเอกสารปิดโครงการ'];
var MENU = [
  ["dash", "📊 แดชบอร์ดภาพรวม", [0,1,2,3,4,5]],
  ["form", "📝 ยื่น/จัดการข้อเสนอโครงการ", [1,5]],
  ["list", "📁 รายการโครงการ", [0,1,2,3,4,5]],
  ["follow", "💰 ติดตามผล / เบิกจ่าย / SROI", [1,2,4,5]],
  ["comm", "👥 จัดการผู้ใช้", [0]],
  ["fy", "🗓️ จัดการปีงบประมาณ", [0]]
];

var ST = { role: 5, page: "dash", cur: null, ps: [], fiscalYears: ["2570"], fy: "2570", trans: [] };
var API_URL = (typeof window !== "undefined" && window.API_URL) || "", CLOUD = !!API_URL, TOKEN = "", USER = null, LEADS = [];

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmt(n) { return Number(n||0).toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2}); }
function tag(s) { var c = /ไม่ผ่าน|ยกเลิก|ส่งกลับ/.test(s) ? "bad" : /^รอ|ร่าง|ส่งข้อเสนอ/.test(s) ? "w" : "ok"; return '<span class="tag '+c+'">'+esc(s)+'</span>'; }

function render() {
  var nav = document.getElementById("nav");
  if (nav && USER) {
    var roleOpts = (USER.roles || [USER.role]).map(function(r){ return '<option value="'+r+'"'+(r===+ST.role?' selected':'')+'>'+ROLES[r]+'</option>'; }).join('');
    nav.innerHTML = '<div class="ucard"><label style="color:#cfe0f5">บทบาทปัจจุบัน</label><select onchange="switchRole(this.value)" style="width:100%;margin-top:4px">'+roleOpts+'</select></div>' +
      MENU.filter(function(m){ return m[2].indexOf(+ST.role) > -1; }).map(function(m){ return '<button class="nav '+(m[0]===ST.page?'on':'')+'" onclick="go(\''+m[0]+'\')">'+m[1]+'</button>'; }).join('');
  }
  var h = {dash:dash, form:form, list:list, follow:follow, comm:comm, fy:fiscalSettings}[ST.page] || dash;
  document.getElementById("main").innerHTML = h();
}

function go(p) { ST.page = p; render(); window.scrollTo(0,0); }
function switchRole(v) { ST.role = +v; ST.page = "dash"; load().then(render); }

function api(a, d) {
  return fetch(API_URL, {method:"POST", body:JSON.stringify({a:a, t:TOKEN, d:d||{}, role:+ST.role})})
    .then(function(r){ return r.json(); }).then(function(r){ if(!r.ok) throw new Error(r.e); return r.d; });
}

function load() {
  return api("boot", {fy:ST.fy}).then(function(r){
    USER = r.user; ST.role = USER.role; ST.ps = r.projects || []; LEADS = r.leads || []; ST.trans = r.trans || [];
  });
}

// โค้ดส่วนแดชบอร์ด รายการ ฟอร์ม และจัดการสถานะเชื่อมต่อกับ Backend V3.0
// สามารถประกอบรวมเข้ากับฟังก์ชันแสดงผลตาราง/กราฟเดิมของคุณได้ทันที

if(CLOUD) {
  TOKEN = sessionStorage.getItem("asvt") || "";
  if(!TOKEN) {
    var email = prompt("กรุณากรอกอีเมลเข้าสู่ระบบ:");
    var pin = prompt("กรุณากรอกรหัสผ่าน:");
    api("login", {email:email, password:pin}).then(function(r){ TOKEN=r.t; sessionStorage.setItem("asvt", TOKEN); return load(); }).then(render);
  } else { load().then(render); }
} else { render(); }
</script>
</body>
</html>
